name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish again, e.g. v3.0.1
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tag matches the extension version
        run: |
          version=$(node -p "require('./packages/tts-editor/package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match packages/tts-editor/package.json version $version"
            exit 1
          fi

      - name: Build
        run: |
          for package in xmlbundle savefile tts-gateway gateway-client; do
            npm ci --prefix "packages/$package"
          done
          npm run build:libs
          npm run build:gateway
          npm run build:client
          npm ci --prefix packages/tts-editor
          npm run build:editor
          npm run smoke --prefix packages/tts-editor

      - name: Package VSIX
        run: npm run vscode:package --prefix packages/tts-editor

      - name: Publish to Open VSX (trusted publisher, no token)
        run: npx --yes ovsx@^1.2.0 publish dist/tts-tools.vsix --skip-duplicate

      - name: GitHub release with the VSIX
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          cp dist/tts-tools.vsix "dist/tts-tools-${TAG#v}.vsix"
          gh release create "$TAG" "dist/tts-tools-${TAG#v}.vsix" \
            --title "TTS Tools $TAG" \
            --notes "See the [changelog](https://github.com/Eunomiac/tts-tools/blob/main/packages/tts-editor/CHANGELOG.md)."
